<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOC Hub — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1f30;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        color: #94a3b8;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        color: #17b8ac;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        This page hasn't been loaded before, so DOC Hub can't show it without a connection.
        Documents and photos you've already opened are still available — try opening them again
        from where you found them last.
      </p>
      <a href="/">Try the library again</a>
    </div>
  </body>
</html>
